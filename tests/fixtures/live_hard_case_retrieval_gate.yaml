# Retrieval-only hard cases for the live vector index.
# These are real user-style queries, not fixture-backed fake chunk ids.

- case_id: HC-LIVE-001
  query: "Can we impose liquidated damages if the contractor is late delivering the project?"
  expected_behavior: "retrieval"
  expected_source_family: "sharia_standard"
  expected_candidate_standards: ["SS-05", "SS-11"]

- case_id: HC-LIVE-002
  query: "Can the bank charge a late fee on a cash loan?"
  expected_behavior: "retrieval"
  expected_source_family: "sharia_standard"
  expected_candidate_standards: ["SS-03", "SS-19"]

- case_id: HC-LIVE-003
  query: "هل شرط غرامة التأخير في عقود المقاولات شرط ربوي؟"
  expected_behavior: "clarification"
  expected_source_family: "sharia_standard"
  expected_candidate_standards: ["SS-05", "SS-11"]
