  applies_to_archetypes: [ARC-CF, ARC-SELLER, ARC-BANK-ISL]
  material_facts: [early_settlement, rebate_stipulated_in_contract]
  outcomes:
    - when: {early_settlement: false}
      outcome: no_issue_under_this_rule
    - when: {early_settlement: true, rebate_stipulated_in_contract: false}
      outcome: no_issue_under_this_rule
    - when: {early_settlement: true, rebate_stipulated_in_contract: true}
      outcome: conditional
  unknown_fact_question: "Does the contract promise a fixed discount if you pay everything early?"
  unknown_fact_questions:
    early_settlement: "Does the contract allow you to pay off the remaining balance early?"
    rebate_stipulated_in_contract: "Does the contract promise a fixed discount if you pay everything early?"
  precedence_note: null
  scholar_signoff: {reviewer_id: null, date: null, decision: pending}
  status: draft
